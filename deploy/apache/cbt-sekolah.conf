# Virtual host GarudaCBT untuk domain cbtmadah.web.id
#
# Pasang setelah domain mengarah ke server ini:
#   sudo cp deploy/apache/cbt-sekolah.conf /etc/apache2/sites-available/
#   sudo a2ensite cbt-sekolah
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Untuk uji lokal tanpa DNS publik, tambahkan baris berikut ke /etc/hosts:
#   127.0.0.1 cbtmadah.web.id www.cbtmadah.web.id

<VirtualHost *:80>
    ServerName cbtmadah.web.id
    ServerAlias www.cbtmadah.web.id

    DocumentRoot /var/www/cbt

    <Directory /var/www/cbt>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Folder internal tidak boleh disajikan langsung.
    <DirectoryMatch "^/var/www/cbt/(system|application|vendor|installer/includes|backups)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/cbt-sekolah-error.log
    CustomLog ${APACHE_LOG_DIR}/cbt-sekolah-access.log combined

    # Aktifkan bila sertifikat sudah terpasang dan ingin memaksa HTTPS:
    # Redirect permanent / https://cbtmadah.web.id/
</VirtualHost>

# HTTPS. Sertifikat snakeoil dipakai sebagai placeholder; ganti dengan
# sertifikat Let's Encrypt saat domain sudah aktif:
#   sudo certbot --apache -d cbtmadah.web.id -d www.cbtmadah.web.id
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cbtmadah.web.id
    ServerAlias www.cbtmadah.web.id

    DocumentRoot /var/www/cbt

    <Directory /var/www/cbt>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/cbt/(system|application|vendor|installer/includes|backups)">
        Require all denied
    </DirectoryMatch>

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/cbt-sekolah-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/cbt-sekolah-ssl-access.log combined
</VirtualHost>
</IfModule>
